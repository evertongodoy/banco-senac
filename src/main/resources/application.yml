server:
  port: 8080

spring:
  application:
    name: banco
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:mysql://localhost:3305/banco_senac_db?useSSL=false&allowPublicKeyRetrieval=true
    username: banco
    password: banco
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true